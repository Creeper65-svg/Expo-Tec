
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de credenciales - Expo Escolar 2026</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #eef1f8;
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.contenedor {
  background: white;
  width: 100%;
  max-width: 430px;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 5px 20px #0002;
}

h1, h2 {
  color: #092e68;
  text-align: center;
}

h1 { font-size: 24px; }

input {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: 1px solid #b8c3d8;
  border-radius: 9px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  background: #092e68;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#mensaje {
  margin-top: 18px;
  text-align: center;
  font-size: 14px;
}

#resultado {
  display: none;
  margin-top: 25px;
}

.dato {
  padding: 12px;
  margin-top: 8px;
  background: #f1f4fa;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

.etiqueta {
  color: #64748b;
  font-size: 12px;
  display: block;
  margin-bottom: 5px;
}

.valor {
  color: #092e68;
  font-weight: bold;
}

.estado {
  text-align: center;
  padding: 14px;
  margin-top: 18px;
  border-radius: 9px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="contenedor">

  <h1>🎓 EXPO ESCOLAR 2026</h1>
  <h2>Acceso de directivos</h2>

  <p style="text-align:center">
    Ingresá tus datos para confirmar tu identidad
    y consultar la credencial.
  </p>

  <form id="formulario">

    <input
      type="email"
      id="correo"
      placeholder="Correo electrónico"
      autocomplete="username"
      required
    >

    <input
      type="password"
      id="contrasena"
      placeholder="Contraseña"
      autocomplete="current-password"
      required
    >

    <button id="boton" type="submit">
      CONFIRMAR IDENTIDAD
    </button>

  </form>

  <p id="mensaje"></p>

  <div id="resultado">
    <h2>Credencial encontrada</h2>

    <div class="dato">
      <span class="etiqueta">Nombre</span>
      <span class="valor" id="nombre"></span>
    </div>

    <div class="dato">
      <span class="etiqueta">Apellido</span>
      <span class="valor" id="apellido"></span>
    </div>

    <div class="dato">
      <span class="etiqueta">DNI</span>
      <span class="valor" id="dni"></span>
    </div>

    <div class="dato">
      <span class="etiqueta">Correo electrónico</span>
      <span class="valor" id="correoVisitante"></span>
    </div>

    <div class="dato">
      <span class="etiqueta">Categoría</span>
      <span class="valor" id="categoria"></span>
    </div>

    <div class="dato">
      <span class="etiqueta">Institución</span>
      <span class="valor" id="institucion"></span>
    </div>

    <div id="estado" class="estado"></div>
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC0X4ZhY-Owf7bV2oNn15YR1KGIYnSCgnA",
  authDomain: "expo-escolar-2026.firebaseapp.com",
  projectId: "expo-escolar-2026",
  storageBucket: "expo-escolar-2026.firebasestorage.app",
  messagingSenderId: "274619490573",
  appId: "1:274619490573:web:20b74a8314392dd1be9044",
  measurementId: "G-JC0W6XCN4W"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const formulario = document.getElementById("formulario");
const mensaje = document.getElementById("mensaje");
const resultado = document.getElementById("resultado");
const boton = document.getElementById("boton");

const token = new URLSearchParams(
  window.location.search
).get("token");

formulario.addEventListener("submit", async (e) => {

  e.preventDefault();

  resultado.style.display = "none";
  boton.disabled = true;
  boton.textContent = "VERIFICANDO...";
  mensaje.style.color = "#092e68";
  mensaje.textContent = "Verificando identidad...";

  try {

    if (!token) {
      throw new Error("No se encontró el código QR. Escaneá nuevamente.");
    }

    // 1. Iniciar sesión del directivo
    const correo = document.getElementById("correo").value.trim();
    const contrasena = document.getElementById("contrasena").value;

    const credencial = await signInWithEmailAndPassword(
      auth,
      correo,
      contraseña
    );

    const uid = credencial.user.uid;

    // 2. Comprobar autorización del directivo
    const directivoRef = doc(db, "directivos", uid);
    const directivoSnap = await getDoc(directivoRef);

    if (
      !directivoSnap.exists() ||
      directivoSnap.data().autorizado !== true
    ) {
      throw new Error("Tu cuenta no está autorizada para consultar credenciales.");
    }

    // 3. Buscar la credencial por el token del QR
    const registroRef = doc(db, "registros", token);
    const registroSnap = await getDoc(registroRef);

    if (!registroSnap.exists()) {
      throw new Error("No se encontró ninguna credencial con este código QR.");
    }

    const datos = registroSnap.data();

    // 4. Mostrar los datos del visitante
    document.getElementById("nombre").textContent = datos.nombre || "";
    document.getElementById("apellido").textContent = datos.apellido || "";
    document.getElementById("dni").textContent = datos.dni || "";
    document.getElementById("correoVisitante").textContent = datos.correo || "";
    document.getElementById("categoria").textContent = datos.categoria || "";
    document.getElementById("institucion").textContent = datos.institucion || "";

    // 5. Comprobar vencimiento de 24 horas
    const estado = document.getElementById("estado");

    if (!datos.createdAt || typeof datos.createdAt.toDate !== "function") {
      estado.textContent = "NO SE PUDO COMPROBAR EL VENCIMIENTO";
      estado.style.background = "#fff3cd";
      estado.style.color = "#856404";
    } else {
      const fechaCreacion = datos.createdAt.toDate();
      const vencimiento = fechaCreacion.getTime() + (24 * 60 * 60 * 1000);
      const vigente = Date.now() < vencimiento;

      if (vigente) {
        estado.textContent = "✓ CREDENCIAL VIGENTE";
        estado.style.background = "#d1fae5";
        estado.style.color = "#065f46";
      } else {
        estado.textContent = "✕ CREDENCIAL VENCIDA";
        estado.style.background = "#fee2e2";
        estado.style.color = "#991b1b";
      }
    }

    mensaje.style.color = "green";
    mensaje.textContent = "Identidad del directivo confirmada. Acceso autorizado.";

    formulario.style.display = "none";
    resultado.style.display = "block";

  } catch (error) {

    console.error(error);

    mensaje.style.color = "red";
    mensaje.textContent = error.message;

  } finally {

    boton.disabled = false;
    boton.textContent = "CONFIRMAR IDENTIDAD";

  }

});

</script>

</body>
</html>
